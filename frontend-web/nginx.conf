# 统一入口：浏览器只访问本容器的同源 /api，由 Nginx 按路径分流到后端各服务，
# 因此前端不再需要跨域请求（CORS）。

# WebSocket 升级头（map 必须位于 http 上下文，即 server 块之外）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 性能：文本类响应 gzip 压缩
gzip on;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
gzip_min_length 1k;
gzip_vary on;

# 访问日志使用 $uri（不含查询参数）：WebSocket 的 JWT 通过 query 传递，
# 用 $request_uri 记录会把 token 写进日志（可重放），故统一脱敏
log_format main_no_args '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 隐藏 Nginx 版本号，避免信息泄露
    server_tokens off;
    # 日志记录路径与脱敏格式（不记录查询参数，避免 JWT token 落盘）
    access_log /var/log/nginx/access.log main_no_args;

    # Docker 内置 DNS：用服务名解析，容器重建后 IP 变化也能自动跟上
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 基础安全响应头（防嵌入 / 防嗅探 / 防 Referer 泄露）
    # 注意：location 内一旦出现 add_header，server 级 add_header 对该 location 不再继承，
    # 因此下面各 location 均不使用自己的 add_header（/assets/ 仅用 expires 设置缓存）。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # webserver 独占接口（回测 / 数据下载 / 交易对与策略列表 / FreqAI 等）
    # → freqtrade webserver（8081）
    # 注意：freqtrade 真实路由是 /api/v1/background（下载任务进度），而非 background_tasks
    location ~ ^/api/v1/(backtest|download_data|background|pairlists|available_pairs|pair_history|strategies|exchanges|hyperoptloss|freqaimodels|lookahead_analysis|recursive_analysis) {
        set $ws_upstream freqtrade-ws:8081;
        proxy_pass http://$ws_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 其余 /api（状态 / 交易 / 登录 / WebSocket 等）→ 交易进程（8080）
    location /api/ {
        set $trade_upstream freqtrade:8080;
        proxy_pass http://$trade_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 静态资源：Vite 构建产物带内容哈希，可长期缓存
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
