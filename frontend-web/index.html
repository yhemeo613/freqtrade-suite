<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Freqtrade 控制台</title>
        <script>
            // 防闪暗色主题：默认暗色,优先读已保存设置(键与 settings store 统一为 ftzh.settings)
            try {
                var ftTheme =
                    JSON.parse(localStorage.getItem("ftzh.settings") || "{}").theme || "dark";
                if (ftTheme === "dark") document.documentElement.classList.add("dark");
            } catch (e) {
                document.documentElement.classList.add("dark");
            }
        </script>
    </head>
    <body>
        <div id="app">
            <!-- 弱网加载反馈: Vue 挂载后自动被替换;避免慢链路下黑屏无反馈 -->
            <div
                style="
                    display: flex;
                    min-height: 100vh;
                    align-items: center;
                    justify-content: center;
                    flex-direction: column;
                    gap: 12px;
                "
            >
                <div
                    style="
                        width: 28px;
                        height: 28px;
                        border: 3px solid rgba(128, 128, 128, 0.25);
                        border-top-color: #38bdf8;
                        border-radius: 50%;
                        animation: ft-spin 0.9s linear infinite;
                    "
                ></div>
                <div style="color: #9ca3af; font-size: 13px">正在连接交易控制台…</div>
                <style>
                    @keyframes ft-spin {
                        to {
                            transform: rotate(360deg);
                        }
                    }
                </style>
            </div>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
