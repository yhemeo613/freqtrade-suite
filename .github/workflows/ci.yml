name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端(typecheck / lint / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      # lockfile 可能含内网源 resolved URL,统一重写到公共镜像源
      - run: npm ci --replace-registry-host=always --registry=https://registry.npmmirror.com
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-web/dist
          if-no-files-found: error

  server:
    name: 服务端(Python 语法 / Compose / 配置模板校验)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python 语法检查
        run: python -m compileall -q frontend-server/freqtrade
      - name: Docker Compose 配置校验
        run: docker compose config --quiet
      - name: 配置模板 JSON 校验
        run: |
          python -m json.tool frontend-server/user_data/config.example.json > /dev/null
          python -m json.tool frontend-server/user_data/config_ws.json > /dev/null
